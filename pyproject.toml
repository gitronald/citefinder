[project]
name = "citefinder"
version = "0.14.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=2.1.0",
    "pkgskills>=0.5.1",
    "polars>=2.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "typer>=0.27.3",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/citefinder"

[project.scripts]
citefinder = "citefinder.cli:app"

[project.entry-points."pkgskills.hosts"]
citefinder = "citefinder.host:HOST"

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[build-system]
# Floor matches the dev-group pin so the wheel test uses the release backend
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Skill prompts are read at runtime, so force them into the wheel and sdist
artifacts = ["citefinder/prompts/**/*.md"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/citefinder",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    # README links into docs/
    "/docs",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17.1,<0.18",
    "types-requests>=2.33.0.20261006",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["citefinder", "tests"]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["citefinder"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
