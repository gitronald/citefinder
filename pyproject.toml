[project]
name = "citefinder"
version = "0.8.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=2.0.0b0",
    "polars>=1.44.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typer>=0.25.1",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/citefinder"

[project.scripts]
citefinder = "citefinder.cli:app"

[build-system]
# Floor mirrored by the dev-group pin, so the wheel test exercises the same
# backend family as an isolated release build.
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The bundled `use-citefinder` skill is package data that `citefinder install`
# reads at runtime, so it has to ship in the wheel and sdist alongside the .py
# files. hatchling already picks it up (it lives inside the package and isn't
# VCS-ignored); declaring it here — globally, so both targets — states the
# dependency and forces inclusion even if the path later becomes ignored.
# tests/test_install.py builds a real wheel to check the outcome, since an
# editable install resolves the body from the repo either way.
artifacts = ["citefinder/prompts/*.md"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), the .claude/ holder, tests, and tooling out of the
# published sdist.
only-include = [
    "/citefinder",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pre-commit",
    "pyrefly",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff",
    "types-requests>=2.33.0.20260518",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["citefinder", "tests"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
