[project]
name = "citefinder"
version = "0.13.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "bibtexparser>=2.0.0",
    "pkgskills>=0.5.1",
    "polars>=1.44.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "typer>=0.25.1",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/citefinder"

[project.scripts]
citefinder = "citefinder.cli:app"

[project.entry-points."pkgskills.hosts"]
citefinder = "citefinder.host:HOST"

[build-system]
# Floor mirrored by the dev-group pin, so the wheel test exercises the same
# backend family as an isolated release build.
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The bundled `use-citefinder` skill and its references are package data that
# `citefinder skill`, `doc`, and `install` read at runtime, so they have to ship
# in the wheel and sdist alongside the .py files. hatchling already picks them
# up (they live inside the package and aren't VCS-ignored); declaring them
# here — globally, so both targets — states the dependency and forces inclusion
# even if the path later becomes ignored. tests/test_host.py builds a real
# wheel to check the outcome, since an editable install resolves the body from
# the repo either way.
artifacts = ["citefinder/prompts/**/*.md"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), the .claude/ holder, tests, and tooling out of the
# published sdist.
only-include = [
    "/citefinder",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    # README links into docs/, so it ships too or those links dead-end on PyPI.
    "/docs",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml, so the
    # commit hook and `uv run ruff` (CI, the Stop hook) apply one rule set.
    # Bump the two together.
    "ruff>=0.16,<0.17",
    "types-requests>=2.33.0.20260518",
]

[tool.ruff]
target-version = "py311"
# ruff 0.16 formats Python fences inside Markdown; keep it off prose (READMEs,
# changelogs, plans). Drop this line to have fenced code formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["citefinder", "tests"]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["citefinder"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
